<!DOCTYPE html>
<html lang="en">
<head>
<base target="_blank">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>/ɔːlˈtəːnətɪv/ – digital library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- the library data: the script answers from script.google.com through a redirect to googleusercontent.com -->
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600..900&family=Roboto+Mono:ital,wght@0,400..700;1,400..700&family=Source+Code+Pro:wght@400..700&display=swap" rel="stylesheet">
<style>
  /* same tokens as the exposition stylesheet (pg.css). Sizes are in rem, so phones can scale the whole page (see the script). */
  :root {
    --paper: #ffffff; --ink: #000000; --red: #d0302b; --mute: #6b6b6b; --rule: #000000;
    --mono: "Roboto Mono", "Source Code Pro", monospace;
    --display: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
    --text: clamp(.9375rem, 0.25vw + .8438rem, 1.125rem);
    --gut: clamp(1rem, 4.5vw, 4.5rem);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { font: 400 var(--text)/1.6 var(--mono); -webkit-font-smoothing: antialiased; padding: clamp(2rem, 6vw, 5.5rem) var(--gut) 6rem; }
  main { max-width: 73.75rem; }
  a { color: inherit; text-decoration: underline; text-decoration-color: var(--red); text-decoration-thickness: .14em; text-underline-offset: .2em; }
  a:hover { color: var(--red); }
  :focus-visible { outline: .1875rem solid var(--red); outline-offset: .1875rem; }

  h1 { font: 900 clamp(2.75rem, 9vw, 8.25rem)/.9 var(--display); letter-spacing: -.05em; margin: 0 0 .3em -.04em; }
  .lede { max-width: 52ch; margin: 0 0 1.75rem; }
  .button { display: inline-block; background: var(--red); color: var(--paper); text-decoration: none;
    font: 800 clamp(1rem, .5vw + .75rem, 1.1875rem)/1.1 var(--display); letter-spacing: -.01em; padding: .62em .95em .68em; }
  .button:hover { background: var(--ink); color: var(--paper); }
  .button.quiet { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 .125rem var(--ink); }
  .button.quiet:hover { background: var(--ink); color: var(--paper); }
  .actions { display: flex; flex-wrap: wrap; gap: .75rem 1rem; }

  .filters { margin: clamp(2.5rem, 6vw, 4.5rem) 0 2rem; border-top: .125rem solid var(--rule); padding-top: 1.375rem; }
  .row { display: flex; flex-wrap: wrap; gap: .75rem 1.25rem; align-items: end; margin-bottom: 1.125rem; }
  label { display: block; font-size: .82em; color: var(--mute); margin-bottom: .375rem; }
  input[type=search], select { font: inherit; color: inherit; background: var(--paper); border: .125rem solid var(--ink); border-radius: 0; padding: .45em .6em; min-width: min(100%, 20rem); }
  .chips { display: flex; flex-wrap: wrap; gap: .5rem; margin: 0; padding: 0; list-style: none; }
  .chip { font: 700 .95em/1.1 var(--display); letter-spacing: -.01em; background: var(--paper); color: var(--ink);
    border: .125rem solid var(--ink); border-radius: 62.4375rem; padding: .42em .8em; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .chip:hover { border-color: var(--red); }
  .clear { font: inherit; background: none; border: 0; padding: 0; color: inherit; text-decoration: underline; text-decoration-color: var(--red); cursor: pointer; }
  .count { color: var(--mute); margin: 0 0 .5rem; }

  .entries { list-style: none; margin: 0; padding: 0; }
  .entry { border-top: .125rem solid var(--rule); padding: 1.5rem 0 1.75rem; display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: .5rem 2.5rem; }
  .entry:last-child { border-bottom: .125rem solid var(--rule); }
  .entry h2 { font: 800 clamp(1.375rem, 1.6vw + .75rem, 2.375rem)/1.08 var(--display); letter-spacing: -.02em; margin: 0 0 .3em; }
  .meta { margin: 0; }
  .type { color: var(--mute); margin: 0 0 .6em; }
  .desc { margin: .7em 0 0; max-width: 60ch; }
  .side { display: flex; flex-direction: column; gap: .875rem; align-items: flex-start; }
  .side .chip { font-size: .82em; }
  details { width: 100%; }
  summary { cursor: pointer; color: var(--mute); }
  details ul { list-style: none; padding: 0; margin: .5rem 0 0; }
  details li { margin: 0 0 .375rem; }
  details button { font: 700 1em/1.25 var(--display); text-align: left; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-decoration-color: var(--red); }

  /* right column, above the keywords: an image thumbnail, or the link between two "+" of varying size */
  .thumb { display: block; padding: 0; border: 0; background: none; cursor: zoom-in; max-width: 100%; }
  .thumb img { display: block; max-width: 100%; max-height: 18.75rem; height: auto; }
  .thumb:hover img { outline: .1875rem solid var(--red); outline-offset: .1875rem; }
  .url { display: block; font: 700 clamp(1.125rem, 1.1vw + .5625rem, 1.625rem)/1.25 var(--display); letter-spacing: -.015em;
    text-decoration: none; overflow-wrap: break-word; }
  .url:hover { color: var(--red); }
  .url .plus { color: var(--ink); font-weight: 800; line-height: 0; }
  .url .plus:first-child { margin-right: .3em; }
  .url .plus:last-child { margin-left: .3em; }

  dialog { border: 0; padding: 0; background: none; max-width: calc(100vw - 2rem); max-height: calc(100vh - 2rem); overflow: visible; }
  dialog::backdrop { background: rgba(0, 0, 0, .88); }
  dialog img { display: block; max-width: calc(100vw - 2rem); max-height: calc(100vh - 6rem); width: auto; height: auto; }
  dialog p { color: var(--paper); margin: .75rem 0 0; font-size: .9em; }
  dialog .close { position: absolute; top: -.75rem; right: -.75rem; width: 2.75rem; height: 2.75rem; border: 0; border-radius: 50%;
    background: var(--red); color: var(--paper); font: 800 1.625rem/1 var(--display); cursor: pointer; }
  .entry:target, .entry.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { from { background: #f6d5d3; } to { background: transparent; } }

  /* jump to top: appears once the list has been scrolled well down */
  .top { position: fixed; right: var(--gut); bottom: 1.5rem; z-index: 5; font: 800 1rem/1 var(--display); letter-spacing: -.01em;
    background: var(--paper); color: var(--ink); border: 0; box-shadow: inset 0 0 0 .125rem var(--ink); padding: .7em .95em .75em; cursor: pointer;
    opacity: 0; visibility: hidden; transition: opacity .2s ease, visibility .2s; }
  .top:hover { background: var(--ink); color: var(--paper); }
  .top.on { opacity: 1; visibility: visible; }

  .empty { border-top: .125rem solid var(--rule); padding-top: 1.5rem; max-width: 52ch; }
  #filters[hidden] ~ #empty { margin-top: clamp(2.5rem, 6vw, 4.5rem); }
  .empty p { margin: 0 0 1.25rem; }

  @media (max-width: 760px) {
    .entry { grid-template-columns: 1fr; }
  }
  .phone .entry { grid-template-columns: 1fr; }
  @media (prefers-reduced-motion: reduce) { .entry.flash { animation: none; } }
</style>
</head>
<body>
<main>
  <h1>Digital library</h1>
  <p class="lede">Images and links shared by students, artists and researchers at Fontys Academy of the Arts. Every entry is reviewed before being published in this library.</p>
  <div class="actions">
    <a class="button" id="submit" href="submit.html" target="_self">Submit to the Digital Library</a>
    <!-- _top: leave the RC frame and open the exposition's Home page in the whole window -->
    <a class="button quiet" href="https://www.researchcatalogue.net/view/5004460/5004461" target="_top">Back to Home</a>
  </div>

  <section class="filters" id="filters" hidden>
    <div class="row">
      <div><label for="q">Search titles, authors and descriptions</label><input type="search" id="q" autocomplete="off"></div>
      <div><label for="type">Type</label><select id="type"><option value="">All types</option></select></div>
    </div>
    <label id="kw-label">Keywords: pick one or more to narrow the list</label>
    <ul class="chips" id="keywords" aria-labelledby="kw-label"></ul>
  </section>

  <p class="count" id="count" aria-live="polite"></p>
  <ul class="entries" id="entries"></ul>
  <div class="empty" id="empty" hidden></div>
</main>

<button type="button" class="top" id="top">↑ Top</button>

<dialog id="viewer" aria-label="Image">
  <button type="button" class="close" aria-label="Close">×</button>
  <img alt="">
  <p></p>
</dialog>

<script>
  // The approved entries come from the library spreadsheet, through its Apps Script (Code.gs, ?format=json).
  const DATA_URL = 'https://script.google.com/macros/s/AKfycbyoCptBhhcc_0VpH12DnJcy_5vwQRzoJQulRj9Om2mTi-auTBySrdGfb9f7mFCj4SkefQ/exec?format=json';
  const state = { q: '', type: '', keywords: new Set() };
  const $ = id => document.getElementById(id);
  const el = (tag, props, ...kids) => {
    const n = Object.assign(document.createElement(tag), props || {});
    kids.flat().forEach(k => k != null && n.append(k));
    return n;
  };

  // RC pages have no viewport tag: on phones this frame is laid out 980 px wide and shrunk.
  // Every size is in rem, so a larger root font size scales the page back up. (CSS zoom would leave iPhone text tiny.)
  if (matchMedia('(pointer: coarse)').matches && screen.width && innerWidth > screen.width * 1.3) {
    document.documentElement.style.fontSize = (16 * innerWidth / screen.width).toFixed(1) + 'px';
    document.documentElement.classList.add('phone');
  }

  // the Top button shows after two screens of scrolling
  const topButton = $('top');
  addEventListener('scroll', () => topButton.classList.toggle('on', scrollY > innerHeight * 2), { passive: true });
  topButton.onclick = () => scrollTo({ top: 0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });

  function start(DATA) {

    const items = DATA.items;
    items.forEach(it => { it.kw = new Set(it.keywords.map(k => k.toLowerCase())); });

    // related: entries sharing the most keywords
    items.forEach(it => {
      it.related = items.filter(o => o !== it)
        .map(o => ({ o, n: [...o.kw].filter(k => it.kw.has(k)).length }))
        .filter(x => x.n > 0).sort((a, b) => b.n - a.n).slice(0, 4).map(x => x.o);
    });

    // safe to run again when fresh data replaces the saved copy: lists are rebuilt, handlers are replaced, not added
    function buildFilters() {
      $('keywords').replaceChildren();
      $('type').replaceChildren($('type').options[0]);
      $('filters').hidden = !items.length;
      if (!items.length) return;
      const counts = {};
      items.forEach(it => it.keywords.forEach(k => {
        const key = k.toLowerCase();
        counts[key] = counts[key] || { label: k, n: 0 };
        counts[key].n++;
      }));
      const order = DATA.keywords.map(k => k.toLowerCase());
      Object.keys(counts)
        .sort((a, b) => (order.indexOf(a) + 1 || 999) - (order.indexOf(b) + 1 || 999) || a.localeCompare(b))
        .forEach(key => $('keywords').append(el('li', null, chip(key, counts[key].label + ' (' + counts[key].n + ')'))));
      [...new Set(items.map(it => it.type).filter(Boolean))]
        .forEach(t => $('type').append(el('option', { value: t, textContent: t })));
      $('type').value = state.type;
      $('q').oninput = e => { state.q = e.target.value.trim().toLowerCase(); render(); };
      $('type').onchange = e => { state.type = e.target.value; render(); };
    }

    function chip(key, label) {
      const b = el('button', { type: 'button', className: 'chip', textContent: label });
      b.dataset.key = key;
      b.setAttribute('aria-pressed', state.keywords.has(key));
      b.addEventListener('click', () => toggle(key));
      return b;
    }

    function toggle(key) {
      state.keywords.has(key) ? state.keywords.delete(key) : state.keywords.add(key);
      document.querySelectorAll('#keywords .chip').forEach(b => b.setAttribute('aria-pressed', state.keywords.has(b.dataset.key)));
      render();
    }

    function clearFilters() {
      state.q = ''; state.type = ''; state.keywords.clear();
      $('q').value = ''; $('type').value = '';
      document.querySelectorAll('#keywords .chip').forEach(b => b.setAttribute('aria-pressed', 'false'));
      render();
    }

    function matches(it) {
      if (state.type && it.type !== state.type) return false;
      for (const k of state.keywords) if (!it.kw.has(k)) return false;
      if (state.q) {
        const hay = [it.title, it.authors, it.description, it.keywords.join(' ')].join(' ').toLowerCase();
        if (!hay.includes(state.q)) return false;
      }
      return true;
    }

    function entry(it) {
      const meta = [it.authors, it.year].filter(Boolean).join(', ');
      const side = el('div', { className: 'side' });
      if (it.image) {
        side.append(el('button', { type: 'button', className: 'thumb', onclick: () => view(it), ariaLabel: 'Enlarge image: ' + it.title },
          el('img', { src: it.image.thumb, alt: it.title, loading: 'lazy' })));
      } else if (it.link) {
        // the two plus signs change size from entry to entry, like the word lists in the exposition
        const sizes = ['.8em', '1.6em', '1.15em', '2em', '1em'];
        const plus = n => el('span', { className: 'plus', textContent: '+', ariaHidden: 'true', style: 'font-size:' + sizes[n % sizes.length] });
        side.append(el('a', { className: 'url', href: it.link, rel: 'noopener', title: it.link },
          plus(it.id), el('span', null, shortUrl(it.link).split('/').flatMap((part, i) => i ? [el('wbr'), '/' + part] : [part])), plus(it.id + 2)));
      }
      if (it.keywords.length) side.append(el('ul', { className: 'chips' }, it.keywords.map(k => el('li', null, chip(k.toLowerCase(), k)))));
      if (it.related.length) {
        side.append(el('details', null,
          el('summary', { textContent: 'Related entries (' + it.related.length + ')' }),
          el('ul', null, it.related.map(o => el('li', null,
            el('button', { type: 'button', textContent: o.title, onclick: () => jump(o) }))))));
      }

      return el('li', { className: 'entry', id: 'entry-' + it.id },
        el('div', null,
          el('h2', { textContent: it.title }),
          meta ? el('p', { className: 'meta', textContent: meta }) : null,
          it.type ? el('p', { className: 'type', textContent: it.type }) : null,
          it.description ? el('p', { className: 'desc', textContent: it.description }) : null),
        side);
    }

    // "https://www.example.org/texts/on-knowing.html?x=1" → example.org/texts/on-knowing.html
    function shortUrl(link) {
      try {
        const u = new URL(link);
        let t = u.hostname.replace(/^www\./, '') + u.pathname.replace(/\/$/, '');
        try { t = decodeURI(t); } catch (e) {}
        return t.length > 70 ? t.slice(0, 68) + '…' : t;
      } catch (e) { return link; }
    }

    const viewer = $('viewer');
    viewer.querySelector('.close').onclick = () => viewer.close();
    viewer.onclick = e => { if (e.target === viewer) viewer.close(); }; // click outside the image
    function view(it) {
      Object.assign(viewer.querySelector('img'), { src: it.image.full, alt: it.title });
      viewer.querySelector('p').textContent = [it.title, it.authors, it.year].filter(Boolean).join(' · ');
      viewer.showModal();
    }

    function jump(o) {
      if (!matches(o)) clearFilters();
      const n = $('entry-' + o.id);
      n.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
      n.classList.remove('flash'); void n.offsetWidth; n.classList.add('flash');
    }

    function render() {
      const shown = items.filter(matches);
      $('entries').replaceChildren(...shown.map(entry));
      const filtered = state.q || state.type || state.keywords.size;
      $('count').textContent = items.length ? (filtered ? shown.length + ' of ' + items.length + ' entries' : items.length + (items.length === 1 ? ' entry' : ' entries')) : '';
      const empty = $('empty');
      empty.hidden = shown.length > 0;
      if (!items.length) {
        empty.replaceChildren(el('p', { textContent: 'The library is empty for now. Suggest the first entry: something you read, watched or listened to that changed how you think about knowing.' }));
      } else if (!shown.length) {
        empty.replaceChildren(el('p', { textContent: 'No entries match these filters.' }),
          el('button', { type: 'button', className: 'clear', textContent: 'Clear the filters', onclick: clearFilters }));
      }
    }

    buildFilters();
    render();
  }

  // The script takes 1–2 s to answer. The copy this browser saved last time shows at once,
  // and the fresh data replaces it when it arrives (only if something changed).
  const SAVED = 'library-data';
  let saved = null;
  try {
    saved = localStorage.getItem(SAVED);
    if (saved) start(JSON.parse(saved));
  } catch (e) { saved = null; }
  if (!saved) $('count').textContent = 'Loading the library…';

  // credentials: 'omit' keeps the visitor's Google sign-in out of the request, so phones signed in to Google work too
  fetch(DATA_URL, { credentials: 'omit', cache: 'no-store' })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(text => {
      const data = JSON.parse(text);
      if (text !== saved) start(data);
      try { localStorage.setItem(SAVED, text); } catch (e) {}
    })
    .catch(() => {
      if (saved) return; // keep showing the saved copy
      $('count').textContent = '';
      const empty = $('empty');
      empty.hidden = false;
      empty.replaceChildren(el('p', { textContent: 'The library could not be loaded just now. Reload the page in a moment.' }));
    });
</script>
</body>
</html>
